name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Build with environment variables
        run: |
          # Replace placeholders with actual environment variables
          sed -i "s/your-api-key-here/${{ secrets.FIREBASE_API_KEY }}/g" auth.html
          sed -i "s/your-project.firebaseapp.com/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" auth.html
          sed -i "s/your-project-id/${{ secrets.FIREBASE_PROJECT_ID }}/g" auth.html
          sed -i "s/your-project.firebasestorage.app/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" auth.html
          sed -i "s/your-sender-id/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" auth.html
          sed -i "s/your-app-id/${{ secrets.FIREBASE_APP_ID }}/g" auth.html
          
          sed -i "s/your-api-key-here/${{ secrets.FIREBASE_API_KEY }}/g" index.html
          sed -i "s/your-project.firebaseapp.com/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" index.html
          sed -i "s/your-project-id/${{ secrets.FIREBASE_PROJECT_ID }}/g" index.html
          sed -i "s/your-project.firebasestorage.app/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" index.html
          sed -i "s/your-sender-id/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" index.html
          sed -i "s/your-app-id/${{ secrets.FIREBASE_APP_ID }}/g" index.html
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4